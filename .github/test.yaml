name: Test

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
          with:
            ref: ${{ github.head_ref }}
            persist-credentials: true
        
      - name: Setup Python
        uses: actions/setup-python@v5
          with:
            python-version: '3.15'
            
      - name: Run test script
        run: python testing_actions.py

      - name: Commit and push result
        uses: stefanzweifel/git-auto-commit-action@v7
          with:
            commit_message: Action test commited message
